name: Pkgdown

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.r-lib

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install R and pkgdown dependencies from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            r-base \
            r-base-dev \
            r-cran-bslib \
            r-cran-fs \
            r-cran-ggplot2 \
            r-cran-knitr \
            r-cran-pkgdown \
            r-cran-pkgload \
            r-cran-processx \
            r-cran-ragg \
            r-cran-rmarkdown \
            r-cran-roxygen2 \
            r-cran-testthat \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Update pkgdown parser dependencies
        run: |
          mkdir -p "${R_LIBS_USER}"
          Rscript --vanilla -e '
            .libPaths(Sys.getenv("R_LIBS_USER"))
            install.packages(
              c("downlit", "evaluate"),
              repos = "https://cloud.r-project.org",
              lib = Sys.getenv("R_LIBS_USER")
            )
            .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
            stopifnot(requireNamespace("pkgdown", quietly = TRUE))
          '

      - name: Write pkgdown sidebar
        run: |
          cat > sidebar.html <<'EOF'
          <div class="pkgdown-sidebar">
            <p>Documentation site for the CudaMon R package. </p>
          </div>
          EOF

      - name: Build pkgdown site
        run: |
          Rscript --vanilla -e '
            .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
            print(.libPaths())
            pkgdown::build_site(new_process = FALSE)
          '

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./docs
